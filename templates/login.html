<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Code - Crochet Pattern PDF Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',sans-serif;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(135deg,#1A1A2E 0%,#16213E 50%,#0F3460 100%);
        }
        .card {
            background:white;
            border-radius:24px;
            padding:48px 40px;
            width:100%;
            max-width:420px;
            text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,0.3);
        }
        .icon { font-size:3rem; margin-bottom:16px; }
        h1 { font-size:1.6rem; color:#1A1A2E; margin-bottom:6px; }
        h1 span { color:#F39C12; }
        .subtitle { color:#7F8C8D; font-size:0.9rem; margin-bottom:32px; }
        .input-group { position:relative; margin-bottom:20px; }
        .input-group input {
            width:100%;
            padding:16px 20px;
            font-size:1.1rem;
            font-family:'Inter',sans-serif;
            font-weight:600;
            text-align:center;
            letter-spacing:4px;
            text-transform:uppercase;
            border:2px solid #E2E8F0;
            border-radius:16px;
            outline:none;
            transition:all 0.3s;
        }
        .input-group input:focus { border-color:#2E86DE; box-shadow:0 0 0 4px rgba(46,134,222,0.15); }
        .input-group input.error { border-color:#E74C3C; box-shadow:0 0 0 4px rgba(231,76,60,0.15); }
        .btn {
            width:100%;
            padding:16px;
            font-size:1.1rem;
            font-weight:700;
            color:white;
            border:none;
            border-radius:16px;
            cursor:pointer;
            background:linear-gradient(135deg,#2E86DE,#1B5FAA);
            transition:all 0.3s;
            font-family:'Inter',sans-serif;
        }
        .btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(46,134,222,0.4); }
        .btn:disabled { opacity:0.6; transform:none; cursor:not-allowed; }
        .error-msg {
            color:#E74C3C;
            font-size:0.85rem;
            font-weight:600;
            margin-top:12px;
            display:none;
        }
        .footer { margin-top:24px; color:#BDC3C7; font-size:0.75rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🧶</div>
        <h1>Crochet Pattern <span>PDF Generator</span></h1>
        <p class="subtitle">Enter your access code to continue</p>

        <div class="input-group">
            <input type="text" id="codeInput" placeholder="ACCESS CODE" maxlength="20"
                   onkeyup="if(event.key==='Enter')submitCode()">
        </div>

        <button class="btn" id="submitBtn" onclick="submitCode()">
            Unlock Access
        </button>

        <p class="error-msg" id="errorMsg">Invalid access code. Please try again.</p>

        <p class="footer">Need an access code? Contact the creator.</p>
    </div>

    <script>
        async function submitCode() {
            const code = document.getElementById('codeInput').value.trim();
            if (!code) return;

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Checking...';

            try {
                const formData = new FormData();
                formData.append('code', code);
                const resp = await fetch('/login', { method: 'POST', body: formData });
                const result = await resp.json();

                if (result.success) {
                    window.location.href = '/';
                } else {
                    document.getElementById('codeInput').classList.add('error');
                    document.getElementById('errorMsg').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('codeInput').classList.remove('error');
                        document.getElementById('errorMsg').style.display = 'none';
                    }, 3000);
                }
            } catch (e) {
                alert('Error: ' + e.message);
            }

            btn.disabled = false;
            btn.textContent = 'Unlock Access';
        }
    </script>
</body>
</html>
